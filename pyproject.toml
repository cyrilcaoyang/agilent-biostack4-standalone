[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agilent-biostack4"
version = "0.2.0"
description = "Standalone Python driver for the Agilent BioStack 4 microplate stacker over RS-232"
readme = "README.md"
authors = [
    { name = "Yang Cao", email = "cyrilcaoyang@gmail.com" },
]
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "pyserial>=3.5",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
agilent-biostack4-serve = "agilent_biostack4.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
