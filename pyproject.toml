[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agilent-biostack4"
version = "0.2.0"
description = "Standalone Python driver for the Agilent BioStack 4 microplate stacker over RS-232"
readme = "README.md"
authors = [
    { name = "Yang Cao", email = "cyrilcaoyang@gmail.com" },
]
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# `sdl-lab-contract` lives with pydantic in the api/dev extras rather than
# in core: the serial driver is usable without any of the REST stack, and
# core deps stay installable on a non-Windows box with no wheels to build.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sdl-lab-contract",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sdl-lab-contract",
]

# Not on PyPI; pinned to the tag whose major.minor equals the STATUS_SPEC
# revision this device speaks (v1.2).
[tool.uv.sources]
sdl-lab-contract = { git = "https://github.com/AccelerationConsortium/sdl-lab-contract", tag = "v1.2.0" }

[project.scripts]
agilent-biostack4-serve = "agilent_biostack4.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
